pipeline:
  acquisition_method: script
  acquisition_path: src/data.py
  transform_command:
  - python
  - -m
  - src.data
  download_declared: true
  download_label: Download filtered data
  date_label: Latest observation
topic_integrity:
  outcome_definition: Reported cases and deaths are new daily counts per million people from official national reports
    compiled by Our World in Data, smoothed over 7 days and averaged to weeks. Containment policy is the OxCGRT
    stringency index (0-100) for national jurisdictions. Workplace mobility is Google's percent change in workplace
    visits against its January-February 2020 baseline. A takeover is the first week a variant family is at least
    50% of sequenced samples (next two sequenced weeks average at least 50%).
  date_basis: Weeks start on the Monday used by CoVariants. Daily values are averaged over the seven days starting
    on that Monday (at least four days required). rel_week 0 is the takeover week; date = event_week + 7 * rel_week.
    Dates are report or observation dates, not infection or death dates.
  surveillance_status: 'All inputs are archived snapshots retrieved 2026-10-11: OxCGRT ended 2022-12-31, the Our
    World in Data GitHub dataset stopped updating 2024-08-19, Google mobility stopped 2022-10, and CoVariants is
    a point-in-time copy. Nothing is live.'
  coverage_limitations: Only countries with a majority takeover observed in at least 30 sequences per week, plus
    policy and case data for at least 12 of 17 weeks, are included. Sequencing is concentrated in high-income countries,
    so findings describe well-sequenced countries. Mobility ends August 2022 in this snapshot, so late Omicron events
    have missing mobility. The world map in question 1 omits countries too small to draw at 1:110m scale (for example
    Singapore, Malta, Bahrain); they still appear in the dumbbell and heatmap views.
  sampling_bias: 'Sequenced samples are not random draws of infections: sequencing effort, targeting of travellers
    or outbreaks, and reporting lags differ by country and over time. Variant share can therefore lead or lag true
    prevalence by weeks.'
  testing_and_reporting_caveat: Reported cases depend on testing volume, test access, case definitions and reporting
    schedules (some countries report weekly), all of which changed over the pandemic and differ between countries.
    Case rises can reflect more testing. Deaths depend on cause-of-death coding; excess mortality is not used.
