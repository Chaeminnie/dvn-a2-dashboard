schema_version: 2
dashboard:
  title: Who divides American voters, and did online phrases move with them?
  subject: usa_elections_2026
  question: How far apart do groups of voters sit by gender, income and region, how did the states move between elections,
    and did a political phrase taking off in search coincide with a change?
  audience: Students, journalists and curious voters who want to see where US voters divide, without a claim that one thing
    caused another
  entrypoint: app.py
  pages:
  - intro_page.py
  - q1_page.py
  - q2_page.py
  - q3_page.py
  - q4_page.py
  - about_page.py
  sample_environment_variable: DASHBOARD_SAMPLE_MODE
sources:
- id: ces
  publisher: Shiro Kuriwaki, Harvard Dataverse
  title: Cumulative CES Common Content (Cooperative Election Study), V12, doi:10.7910/DVN/II2DB6
  url: https://doi.org/10.7910/DVN/II2DB6
  licence: CC0 1.0 (http://creativecommons.org/publicdomain/zero/1.0), as shown on the Dataverse record. The Dataverse community norms ask users to cite the dataset as shown on the dataset page, and it is cited here.
  retrieved: '2026-10-16'
  cadence: Rebuilt after each CES wave; version 12 (guide dated 2026-07-14) covers 2006 to 2025
  status: snapshot
  notes: 'The .dta file was reduced by src/ces_aggregate.py to 225 weighted group shares (no individual respondents). Vote
    choice is the survey''s post-election report: president in 2016, 2020, 2024 and U.S. House in 2018 and 2022. Turnout is
    validated against voter files for matched respondents only.'
- id: medsl_president
  publisher: MIT Election Data and Science Lab
  title: County Presidential Election Returns 2000-2024 (countypres_2000-2024), version 2026-02-25
  url: https://doi.org/10.7910/DVN/VOQCHQ
  licence: CC0 1.0 (http://creativecommons.org/publicdomain/zero/1.0), as shown on the Dataverse record (doi:10.7910/DVN/VOQCHQ). The record asks users to cite the dataset as shown on its page, and it is cited here.
  retrieved: '2026-10-16'
  cadence: Updated after each presidential election; this file was last dated 2026-02-25
  status: snapshot
  notes: County returns compiled from official state election records. Summed to states here. Counties with both a TOTAL row
    and per-mode rows use the TOTAL row only. Alaska is reported by district.
- id: google_trends
  publisher: Google Trends (Google LLC)
  title: 'Google Trends: interest over time and interest by region, United States, five search terms'
  url: https://trends.google.com/trends/
  licence: Reuse is allowed with attribution to Google Trends (https://www.google.com/trends), per the Google Trends help page https://support.google.com/trends/answer/4365538. Values are a relative index.
  retrieved: '2026-10-15'
  cadence: Continuously updated; fixed snapshot exported 2026-10-15
  status: snapshot
  notes: 'Phrases: tradwife, manosphere, MAGA, inflation, border crisis. Monthly series 2015-01 to 2026-09 (October 2026 dropped
    as incomplete). By-state interest covers 2020-11-04 to 2024-11-04. Each phrase is scaled 0 to 100 against its own peak;
    phrases are not comparable.'
datasets:
- id: voter_groups
  source_ids:
  - ces
  sample: data/sample_voter_groups.csv
  processed_output: data/processed_voter_groups.csv
  format: csv
  date_column: date
  primary_key:
  - election_year
  - factor
  - group
  - age_band
  minimum_rows: 200
  latest_observation: '2024-11-05'
  columns:
    date:
      type: date
      role: time
      nullable: false
      date_minimum: '2016-11-08'
      date_maximum: '2024-11-05'
    election_year:
      type: integer
      role: dimension
      nullable: false
      unit: calendar year
      minimum: 2016
      maximum: 2024
    election_type:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Presidential
      - Midterm
    vote_for:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - President
      - U.S. House
    factor:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Gender
      - Income
      - Region
    group:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - Men
      - Women
      - Low
      - Middle
      - High
      - Midwest
      - Northeast
      - South
      - West
    age_band:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - All ages
      - 18-29
      - 30-44
      - 45-64
      - 65+
    n_two_party:
      type: integer
      role: measure
      nullable: false
      unit: respondents with a two-party vote
      minimum: 1
      maximum: 100000
    dem_share_pct:
      type: number
      role: measure
      nullable: false
      unit: '% of the weighted two-party vote'
      minimum: 0
      maximum: 100
    n_validated:
      type: integer
      role: measure
      nullable: false
      unit: respondents matched to a voter file
      minimum: 1
      maximum: 100000
    validated_turnout_pct:
      type: number
      role: measure
      nullable: false
      unit: '% of matched respondents who voted'
      minimum: 0
      maximum: 100
    low_n:
      type: integer
      role: dimension
      nullable: false
      unit: 1 when fewer than 50 respondents
      minimum: 0
      maximum: 1
- id: state_results
  source_ids:
  - medsl_president
  sample: data/sample_state_results.csv
  processed_output: data/processed_state_results.csv
  format: csv
  date_column: date
  primary_key:
  - election_year
  - state_code
  minimum_rows: 150
  latest_observation: '2024-11-05'
  columns:
    date:
      type: date
      role: time
      nullable: false
      date_minimum: '2016-11-08'
      date_maximum: '2024-11-05'
    election_year:
      type: integer
      role: dimension
      nullable: false
      unit: calendar year
      minimum: 2016
      maximum: 2024
    state_code:
      type: string
      role: geography
      nullable: false
      allowed_values: &id002
      - AK
      - AL
      - AR
      - AZ
      - CA
      - CO
      - CT
      - DC
      - DE
      - FL
      - GA
      - HI
      - IA
      - ID
      - IL
      - IN
      - KS
      - KY
      - LA
      - MA
      - MD
      - ME
      - MI
      - MN
      - MO
      - MS
      - MT
      - NC
      - ND
      - NE
      - NH
      - NJ
      - NM
      - NV
      - NY
      - OH
      - OK
      - OR
      - PA
      - RI
      - SC
      - SD
      - TN
      - TX
      - UT
      - VA
      - VT
      - WA
      - WI
      - WV
      - WY
    state:
      type: string
      role: geography
      nullable: false
    region:
      type: string
      role: dimension
      nullable: false
      allowed_values: &id003
      - Northeast
      - Midwest
      - South
      - West
    dem_votes:
      type: integer
      role: measure
      nullable: false
      unit: votes
      minimum: 0
      maximum: 20000000
    rep_votes:
      type: integer
      role: measure
      nullable: false
      unit: votes
      minimum: 0
      maximum: 20000000
    dem_two_party_pct:
      type: number
      role: measure
      nullable: false
      unit: '% of Democratic plus Republican votes'
      minimum: 0
      maximum: 100
    margin_pp:
      type: number
      role: measure
      nullable: false
      unit: percentage points, Democratic minus Republican two-party share
      minimum: -100
      maximum: 100
    previous_election_year:
      type: integer
      role: dimension
      nullable: true
      unit: calendar year
      minimum: 2016
      maximum: 2020
    previous_margin_pp:
      type: number
      role: measure
      nullable: true
      unit: percentage points
      minimum: -100
      maximum: 100
    shift_pp:
      type: number
      role: measure
      nullable: true
      unit: percentage points; negative = toward Republican
      minimum: -100
      maximum: 100
- id: search_monthly
  source_ids:
  - google_trends
  sample: data/sample_search_monthly.csv
  processed_output: data/processed_search_monthly.csv
  format: csv
  date_column: date
  primary_key:
  - keyword
  - date
  minimum_rows: 600
  latest_observation: '2026-09-01'
  columns:
    date:
      type: date
      role: time
      nullable: false
      date_minimum: '2015-01-01'
      date_maximum: '2026-09-01'
    keyword:
      type: string
      role: dimension
      nullable: false
      allowed_values: &id001
      - tradwife
      - manosphere
      - MAGA
      - inflation
      - border crisis
    interest:
      type: integer
      role: measure
      nullable: false
      unit: relative search interest index, 0 to 100
      minimum: 0
      maximum: 100
- id: state_search_shift
  source_ids:
  - google_trends
  - medsl_president
  sample: data/sample_state_search_shift.csv
  processed_output: data/processed_state_search_shift.csv
  format: csv
  date_column: date
  primary_key:
  - keyword
  - state_code
  minimum_rows: 250
  latest_observation: '2024-11-04'
  columns:
    date:
      type: date
      role: time
      nullable: false
      date_minimum: '2024-11-04'
      date_maximum: '2024-11-04'
    keyword:
      type: string
      role: dimension
      nullable: false
      allowed_values: *id001
    state_code:
      type: string
      role: geography
      nullable: false
      allowed_values: *id002
    state:
      type: string
      role: geography
      nullable: false
    region:
      type: string
      role: dimension
      nullable: false
      allowed_values: *id003
    interest:
      type: integer
      role: measure
      nullable: true
      unit: relative search interest index, 0 to 100, 2020-11-04 to 2024-11-04
      minimum: 0
      maximum: 100
    small_state:
      type: string
      role: dimension
      nullable: false
      allowed_values:
      - 'Yes'
      - 'No'
    margin_2020:
      type: number
      role: measure
      nullable: false
      unit: percentage points, Democratic minus Republican
      minimum: -100
      maximum: 100
    margin_2024:
      type: number
      role: measure
      nullable: false
      unit: percentage points, Democratic minus Republican
      minimum: -100
      maximum: 100
    shift_2020_2024:
      type: number
      role: measure
      nullable: false
      unit: percentage points; negative = toward Republican
      minimum: -100
      maximum: 100
views:
- id: who_divides_voters
  dataset_id: voter_groups
  page: q1_page.py
  title: What divides voters most?
  unit: percentage points of the two-party vote (size of the divide, direction); percent of validated voters (turnout)
  source_ids:
  - ces
  controls:
  - key: q1_election
    type: selectbox
    label: Election
    default_value: 2024
    test_value: 2020
    filter:
      column: election_year
      operator: equals
  - key: q1_view
    type: radio
    label: Chart
    default_value: Dot plot
    test_value: Heatmap
  - key: q1_mode
    type: radio
    label: Show
    default_value: Size of the divide
    test_value: Who leans which way
  - key: q1_age
    type: selectbox
    label: Highlight an age band
    default_value: 18-29
    test_value: None
  outputs:
  - chart
  - metric
  - download
- id: state_shift
  dataset_id: state_results
  page: q2_page.py
  title: How did states move between elections?
  unit: change in the Democratic minus Republican margin, percentage points of the two-party vote
  source_ids:
  - medsl_president
  controls:
  - key: q2_election
    type: selectbox
    label: Later election
    default_value: 2024
    test_value: 2020
    filter:
      column: election_year
      operator: equals
  - key: q2_measure
    type: radio
    label: Colour by
    default_value: How the margin moved
    test_value: Who led
  - key: q2_region
    type: multiselect
    label: Region
    default_value: *id003
    test_value:
    - South
    empty_test_value: []
    empty_expected_text: No observations match the selected filters.
    filter:
      column: region
      operator: isin
  outputs:
  - chart
  - metric
  - download
- id: phrase_and_gap
  dataset_id: search_monthly
  page: q3_page.py
  title: Did the gap change after a phrase took off?
  unit: search interest index (0 to 100, relative to each phrase's own peak); size of the gap in percentage points of the
    two-party vote
  source_ids:
  - google_trends
  - ces
  controls:
  - key: q3_keyword
    type: selectbox
    label: Phrase
    default_value: tradwife
    test_value: MAGA
    filter:
      column: keyword
      operator: equals
  - key: q3_factor
    type: selectbox
    label: Gap between
    default_value: Gender
    test_value: Income
  - key: q3_age
    type: selectbox
    label: Age band
    default_value: 18-29
    test_value: 65+
  - key: q3_threshold
    type: slider
    label: Boom threshold (% of the phrase's peak)
    default_value: 50
    test_value: 30
  - key: q3_rule
    type: selectbox
    label: Boom rule
    default_value: First month
    test_value: 3 months in a row
  outputs:
  - chart
  - metric
  - download
- id: search_by_state
  dataset_id: state_search_shift
  page: q4_page.py
  title: Did states that searched more move differently?
  unit: search interest index (0 to 100, by state); change in margin, 2020 to 2024, percentage points of the two-party vote
  source_ids:
  - google_trends
  - medsl_president
  controls:
  - key: q4_keyword
    type: selectbox
    label: Phrase
    default_value: tradwife
    test_value: MAGA
    filter:
      column: keyword
      operator: equals
  - key: q4_view
    type: radio
    label: Chart
    default_value: Maps
    test_value: Scatter
  - key: q4_region
    type: multiselect
    label: Region
    default_value: *id003
    test_value:
    - South
    empty_test_value: []
    empty_expected_text: No observations match the selected filters.
    filter:
      column: region
      operator: isin
  - key: q4_small
    type: checkbox
    label: Leave out small states (fewer than 600,000 two-party votes in 2024)
    default_value: false
    test_value: true
  outputs:
  - chart
  - metric
  - download
pipeline:
  acquisition_method: manual
  acquisition_path: src/data.py
  transform_command:
  - python
  - -m
  - src.data
  download_declared: true
  download_label: Download filtered data
  date_label: Latest observation
topic_integrity:
  office: President of the United States (state results; survey vote for president in 2016, 2020 and 2024) and U.S. House
    (survey vote in the 2018 and 2022 midterms). No Senate, governor or other office.
  geography: 'United States: 50 states and the District of Columbia (state results, Google Trends by state) and the four Census
    regions Northeast, Midwest, South and West. Survey groups are national, not by state.'
  data_status: 'Past elections only (2016 to 2024); nothing is a forecast and no 2026 result exists. State results: compiled
    from official state records, MIT file version 2026-02-25. Survey: Cumulative CES V12 (2026-07-14 guide). Search: fixed
    Google Trends snapshot exported 2026-10-15 (monthly to 2026-09, by state 2020-11-04 to 2024-11-04).'
  timestamp_timezone: Dates are election days (calendar dates, US local) and the first day of each Google Trends month (UTC
    calendar dates). The by-state search window ends on 2024-11-04. No clock times are used.
  result_authority: MIT Election Data and Science Lab, from official state election records; the survey vote shares are weighted
    survey estimates from the Cooperative Election Study, not election results.
  certification_status: 'The MIT county file is compiled from official state sources; certification status is not marked state
    by state for 2024. In its 2020 sources list South Dakota is marked unofficial and several states give no status. Totals
    match the national popular vote (2024: about 75.0 million Democratic and 77.3 million Republican votes).'
  latest_observation_year: 2026
  indicator_definition: Size of a divide = absolute difference in the weighted Democratic share of the two-party vote between
    two groups, in percentage points. Direction = Democratic share minus 50. Margin = Democratic minus Republican share of
    the two-party vote. Shift = margin minus the margin at the previous presidential election.
  aggregation_method: Survey group shares are weighted with the CES year weight among respondents who named a Democratic or
    Republican candidate. State votes are summed from counties. No cross-phrase search aggregates are made.
